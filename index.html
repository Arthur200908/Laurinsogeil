<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Taschenrechner</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <h1>Taschenrechner</h1>
    <p>Geben Sie zwei Zahlen ein und berechnen Sie das Ergebnis.</p>
    <div class="calculator">
      <label>
        Erste Zahl
        <input id="value1" type="number" value="10" />
      </label>
      <label>
        Zweite Zahl
        <input id="value2" type="number" value="10" />
      </label>
      <button id="calculateButton">Rechnen</button>
      <div class="result" id="result">Ergebnis: 100</div>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
